<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seven Deadly Sins</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Orbitron:wght@500;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #050509;
  --gold: #e8c46a;
  --white: #f5f1e8;
}

body {
  min-height: 100vh;
  overflow: hidden;
  color: var(--white);
  background:
    radial-gradient(circle at center, #24131c 0%, #0b080d 38%, #020204 80%);
  font-family: Arial, sans-serif;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .2;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 35px 35px;
}

.scene {
  position: relative;
  width: min(100vw, 1100px);
  height: min(100vh, 850px);
  min-height: 650px;
  margin: auto;
  display: grid;
  place-items: center;
  isolation: isolate;
}

.title {
  position: absolute;
  z-index: 5;
  text-align: center;
  width: 290px;
  text-shadow: 0 0 12px #000, 0 0 30px rgba(232,196,106,.2);
  pointer-events: none;
}

.title .small {
  font: 700 13px Orbitron, sans-serif;
  letter-spacing: 5px;
  color: var(--gold);
  margin-bottom: 10px;
}

.title h1 {
  font: 900 clamp(34px, 6vw, 68px)/.9 Cinzel, serif;
  letter-spacing: 3px;
}

.title h1 span {
  display: block;
  font-size: .75em;
  margin-top: 13px;
  letter-spacing: 8px;
}

.title p {
  margin-top: 20px;
  color: #c8bdc8;
  font-size: 11px;
  letter-spacing: 2px;
  line-height: 1.8;
}

.center-image {
  position: absolute;
  width: 245px;
  height: 245px;
  border-radius: 50%;
  object-fit: cover;
  opacity: .13;
  filter: grayscale(1) contrast(1.5);
  box-shadow: 0 0 70px rgba(180,30,70,.25);
  z-index: 1;
}

.orbit {
  position: absolute;
  width: min(78vw, 650px);
  height: min(78vw, 650px);
  max-height: 650px;
  max-width: 650px;
  border: 1px solid rgba(232,196,106,.25);
  border-radius: 50%;
  box-shadow: 0 0 40px rgba(135,20,60,.13), inset 0 0 40px rgba(135,20,60,.08);
  animation: rotate 32s linear infinite;
}

.orbit::before, .orbit::after {
  content: "";
  position: absolute;
  inset: 24px;
  border: 1px dashed rgba(232,196,106,.18);
  border-radius: 50%;
}

.orbit::after {
  inset: 49px;
  border-style: solid;
  border-color: rgba(255,255,255,.07);
}

.satellite {
  --accent: #fff;
  position: absolute;
  width: 132px;
  height: 132px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 25%, #27232c, #09090e 70%);
  box-shadow: 0 0 20px color-mix(in srgb, var(--accent), transparent 65%);
  display: grid;
  place-items: center;
  text-align: center;
  transform: translate(-50%, -50%);
  animation: counterRotate 32s linear infinite;
}

.satellite .number {
  position: absolute;
  top: -13px;
  right: 8px;
  width: 27px;
  height: 27px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: #08070b;
  display: grid;
  place-items: center;
  font-weight: bold;
  font-size: 12px;
}

.satellite .icon {
  font-size: 37px;
  line-height: 1;
  filter: drop-shadow(0 0 8px var(--accent));
}

.satellite .name {
  font: 700 13px Cinzel, serif;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 5px;
}

.satellite .meaning {
  font-size: 9px;
  color: #c7c0c9;
  margin-top: 3px;
}

.s1 { left: 50%; top: 0%; --accent: #b88cff; }
.s2 { left: 89%; top: 18%; --accent: #f0d65b; }
.s3 { left: 89%; top: 82%; --accent: #ff5a91; }
.s4 { left: 67%; top: 100%; --accent: #61e8ad; }
.s5 { left: 33%; top: 100%; --accent: #ff8c48; }
.s6 { left: 11%; top: 82%; --accent: #ff4059; }
.s7 { left: 11%; top: 18%; --accent: #72baff; }

.legend {
  position: absolute;
  bottom: 24px;
  font: 10px Orbitron, sans-serif;
  letter-spacing: 2px;
  color: #807784;
  text-align: center;
}

.pause {
  position: fixed;
  right: 20px;
  bottom: 20px;
  border: 1px solid #66515e;
  border-radius: 30px;
  background: #0d0a10;
  color: #eee;
  padding: 12px 17px;
  cursor: pointer;
  z-index: 10;
}

.paused .orbit, .paused .satellite { animation-play-state: paused; }

@keyframes rotate { to { transform: rotate(360deg); } }
@keyframes counterRotate { to { transform: translate(-50%, -50%) rotate(-360deg); } }

@media (max-width: 600px) {
  .scene { min-height: 590px; height: 100vh; }
  .orbit { width: 88vw; height: 88vw; }
  .satellite { width: 92px; height: 92px; }
  .satellite .icon { font-size: 26px; }
  .satellite .name { font-size: 9px; }
  .satellite .meaning { font-size: 7px; }
  .satellite .number { width: 22px; height: 22px; font-size: 10px; top: -9px; right: 0; }
  .title { width: 220px; }
  .title h1 { font-size: 32px; }
  .title .small { font-size: 9px; letter-spacing: 3px; }
  .title p { font-size: 8px; }
  .center-image { width: 175px; height: 175px; }
}
</style>
</head>
